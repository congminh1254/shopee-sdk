name: Update Schemas

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Fix vulnerable dependencies
        continue-on-error: true
        run: npm audit fix
      
      - name: Fetch latest schemas
        run: |
          set -e
          npm run fetch-schemas 2>&1 || {
            echo "Error: fetch-schemas failed"
            exit 1
          }

      - name: Generate SDK code and tests
        run: |
          set -e
          npm run generate 2>&1 || {
            echo "Error: generate failed"
            exit 1
          }

      - name: Run spec audit and save report
        run: |
          # audit:specs exits non-zero when gaps are found; we still want to commit the report for visibility.
          npm run audit:specs > spec-audit.txt 2>&1 || true
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update schemas and regenerate SDK from Shopee API'
          committer: GitHub Actions <actions@github.com>
          author: GitHub Actions <actions@github.com>
          branch: update-schemas
          delete-branch: true
          title: 'chore: update schemas and regenerate SDK'
          body: |
            ## 🔄 Automated Schema & SDK Update
            
            This PR updates the Shopee API schemas to the latest version and regenerates the TypeScript SDK managers, schemas, and unit tests.
            
             ### Changes
             - Updated schema definitions from Shopee Open API
             - Regenerated TypeScript SDK Managers and Schemas in `src/`
             - Regenerated automated unit tests in `src/__tests__/generated/`
             - Updated `spec-audit.txt` report generated from latest schemas
            
            ### Generated by
            - Workflow: `${{ github.workflow }}`
            - Run: `${{ github.run_number }}`
            - Triggered: `${{ github.event_name }}`
            
            ---
            *This PR is automatically generated and updated by GitHub Actions.*
          labels: |
            automated
            schemas
            dependencies
          assignees: congminh1254
