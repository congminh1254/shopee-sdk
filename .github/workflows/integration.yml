name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# All runs share one set of sandbox accounts, so only one run uses them at a time; a newer run
# waits instead of invalidating the tokens of the one in progress.
concurrency:
  group: shopee-sandbox
  cancel-in-progress: false

# Three sandbox suites, each in its own job. They run one after another because the user and
# merchant suites share a main account, and a new main-account authorization invalidates the
# previous token. Later jobs still run when an earlier one fails. Missing secrets fail the job.
jobs:
  shop:
    name: Sandbox - Shop
    runs-on: ubuntu-latest
    env:
      SHOPEE_SANDBOX_PARTNER_ID: ${{ secrets.SHOPEE_SANDBOX_PARTNER_ID }}
      SHOPEE_SANDBOX_PARTNER_KEY: ${{ secrets.SHOPEE_SANDBOX_PARTNER_KEY }}
      SHOPEE_SANDBOX_ACCOUNT: ${{ secrets.SHOPEE_SANDBOX_ACCOUNT }}
      SHOPEE_SANDBOX_PASSWORD: ${{ secrets.SHOPEE_SANDBOX_PASSWORD }}
      SHOPEE_SANDBOX_SHOP_ID: ${{ secrets.SHOPEE_SANDBOX_SHOP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run shop sandbox tests
        run: npm run test:sandbox:shop

  user:
    name: Sandbox - User
    needs: shop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SHOPEE_SANDBOX_PARTNER_ID: ${{ secrets.SHOPEE_SANDBOX_PARTNER_ID }}
      SHOPEE_SANDBOX_PARTNER_KEY: ${{ secrets.SHOPEE_SANDBOX_PARTNER_KEY }}
      SHOPEE_SANDBOX_MAIN_ACCOUNT: ${{ secrets.SHOPEE_SANDBOX_MAIN_ACCOUNT }}
      SHOPEE_SANDBOX_MAIN_PASSWORD: ${{ secrets.SHOPEE_SANDBOX_MAIN_PASSWORD }}
      SHOPEE_SANDBOX_MAIN_ACCOUNT_ID: ${{ secrets.SHOPEE_SANDBOX_MAIN_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run user sandbox tests
        run: npm run test:sandbox:user

  merchant:
    name: Sandbox - Merchant
    needs: user
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SHOPEE_SANDBOX_PARTNER_ID: ${{ secrets.SHOPEE_SANDBOX_PARTNER_ID }}
      SHOPEE_SANDBOX_PARTNER_KEY: ${{ secrets.SHOPEE_SANDBOX_PARTNER_KEY }}
      SHOPEE_SANDBOX_MAIN_ACCOUNT: ${{ secrets.SHOPEE_SANDBOX_MAIN_ACCOUNT }}
      SHOPEE_SANDBOX_MAIN_PASSWORD: ${{ secrets.SHOPEE_SANDBOX_MAIN_PASSWORD }}
      SHOPEE_SANDBOX_MAIN_ACCOUNT_ID: ${{ secrets.SHOPEE_SANDBOX_MAIN_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run merchant sandbox tests
        run: npm run test:sandbox:merchant
